# Game world knowledge database for Doomsday: Last Survivors.
# Human-editable. The module gt_spector/game_world.py reads this.

# Component classification:
# - static: fixed UI, always at the same pixel. Direct click; no template
#   search. E.g. shelter (65,800), map_search (38,623).
# - dynamic: non-fixed, located via template search. E.g. avatar border
#   (picture inside changes, border is invariant).
# - drifts: world-scoped, may move with the camera but tracked for reference.
#
# Mission menu note (2026-08-02):
# - mission_menu_static: the invariant part of the mission button, used to
#   identify the mission menu reliably.
# - mission_menu_count: the completed-mission count badge (red background).
#   Not needed yet, but in the future it can be read to auto-collect rewards
#   for completed missions.
#
# Chat note (2026-08-02):
# - chat_static: the invariant part of the chat button, used to identify it.
# - chat_unread: a red-background @ badge that appears when there are unread
#   messages. Not needed yet; in the future it can alert on unread chat.
#
# Alliance menu note (2026-08-02):
# - alliance_menu_static: the invariant part of the alliance button, used to
#   identify it.
# - alliance_menu_count: indicates rewards available inside the alliance menu.
#   Not needed yet; in the future it can be used to claim alliance rewards.
#
# VIP note (2026-08-02):
# - vip_reward: shows if a VIP reward is available. Shifts ~30px right when
#   the VIP level is >9.

version: 1

# Named clickable locations. Each: x, y, and the screens it appears on.
# Static UI chrome is reliable. "drifts" marks world-scoped anchors that may
# move with the camera but are tracked for reference.
locations:
  exit_cancel:       {x: 359, y: 654, screens: [exit_dialog]}
  exit_ok:           {x: 801, y: 648, screens: [exit_dialog]}
  login_failed_ok:   {x: 499, y: 647, screens: [login_failed_dialog]}
  login_failed_device_login: {x: 420, y: 767, screens: [login_failed_dialog]}
  login_failed_more: {x: 558, y: 767, screens: [login_failed_dialog]}
  afk_ok:            {x: 741, y: 676, screens: [afk_popup]}
  glory_league_go:   {x: 575, y: 654, screens: [glory_league_event]}
  avatar:            {x: 49,  y: 39,  screens: [world_map, world_map_regional]}
  shelter:           {x: 65,  y: 800, screens: [world_map, world_map_regional], static: true}
  map_search:        {x: 38,  y: 623, screens: [world_map, world_map_regional], static: true}
  chat:              {x: 139, y: 810, screens: [world_map, world_map_regional]}
  vip_menu:          {x: 113, y: 56,  screens: [world_map, world_map_regional]}
  region_overview:   {x: 1120, y: 800, screens: [world_map, world_map_regional]}
  messages:          {x: 1120, y: 745, screens: [world_map, world_map_regional]}
  region_search:     {x: 439, y: 15,  screens: [world_map, world_map_regional]}
  alliance_flags:    {x: 485, y: 21,  screens: [world_map, world_map_regional]}
  mission_menu:      {x: 34,  y: 698, screens: [world_map]}
  radar_station:     {x: 103, y: 616, screens: [world_map], drifts: true}
  alliance_menu:     {x: 951, y: 800, screens: [world_map], drifts: true}
  hero_menu:         {x: 1040, y: 800, screens: [world_map], drifts: true}
  bag:               {x: 861, y: 782, screens: [world_map], drifts: true}
  campaign_menu:     {x: 800, y: 800, screens: [world_map], drifts: true}

# World zones on the regional map: zone_1 outer, zone_2 middle, zone_3 center.
zones:
  zone_1: {name: "outer ring", note: "outside edge of the region"}
  zone_2: {name: "mid ring",   note: "between zone 1 and zone 3"}
  zone_3: {name: "center",     note: "center part of the region"}

# Map zoom levels. The discriminator between them is the minimap presence in
# the top-right corner (regional zoom shows it; world map does not).
map_levels:
  world_map:
    description: zoomed in, no minimap, actors/vehicles/zombies visible
    fingerprint:
      # No minimap in top-right: a UI-free probe region should be map/ground.
      - [1010, 45, 60, 200, 70, 210, 60, 200]
  world_map_regional:
    description: regional zoom, semi-transparent minimap top-right, no actors
    fingerprint:
      # Minimap present: probe region is a distinct minimap surface.
      - [1010, 45, 140, 255, 140, 255, 140, 255]

# Screens with stable anchor fingerprints (captured live, refined over time).
screens:
  exit_dialog:
    description: '"Exit game?" confirmation with CANCEL / OK'
    fingerprint: []
  glory_league_event:
    description: 'Pompeii Glory League event splash with GO button'
    fingerprint:
      - [575, 654, 60, 200, 90, 200, 30, 120]  # GO button (saturated)
      - [517, 100, 30, 200, 40, 200, 40, 200]  # event panel area
  afk_popup:
    description: '"Auto collect AFK resources" popup with single orange OK button'
    fingerprint:
      - [741, 676, 190, 255, 130, 200, 30, 110]  # orange OK button
      - [550, 820, 0, 60, 0, 60, 0, 60]  # dim panel bottom
  login_failed_dialog:
    description: '"Login failed: session expired!" modal with OK / Device Log In / More'
    fingerprint:
      - [517, 671, 220, 255, 220, 255, 220, 255]  # bright title text
      - [550, 820, 0, 60, 0, 60, 0, 60]  # dim dialog panel bottom
  world_map:
    description: world map, zoomed in (no minimap)
    fingerprint:
      - [15, 9, 110, 180, 90, 160, 60, 130]   # avatar border top-left corner (static)
      - [15, 68, 90, 160, 80, 150, 70, 130]   # avatar border bottom-left (static)
  world_map_regional:
    description: regional map, minimap top-right
    fingerprint:
      - [15, 9, 110, 180, 90, 160, 60, 130]   # avatar border top-left corner (static)
      - [1010, 45, 140, 255, 140, 255, 140, 255]  # minimap present

# Navigation: reachable screens from each screen + recommended action.
navigation:
  exit_dialog:
    shelter:            {action: click, location: exit_cancel}
    world_map:          {action: click, location: exit_cancel}
  afk_popup:
    world_map:          {action: click, location: afk_ok}
  login_failed_dialog:
    world_map:          {action: click, location: login_failed_ok}
  world_map:
    world_map_regional: {action: zoom_out}
    shelter:            {action: click, location: shelter}
    chat:               {action: click, location: chat}
    hero_menu:          {action: locate, name: hero_menu}
    bag:                {action: locate, name: bag}
    alliance_menu:      {action: locate, name: alliance_menu_static}
    campaign_menu:      {action: locate, name: campaign_menu}
    radar_station:      {action: locate, name: radar_station}
  world_map_regional:
    world_map:          {action: zoom_in}
    shelter:            {action: click, location: shelter}
    chat:               {action: click, location: chat}
    vip_menu:           {action: click, location: vip_menu}
    region_overview:    {action: click, location: region_overview}
    messages:           {action: click, location: messages}
