# Game world knowledge database for Doomsday: Last Survivors.
# Human-editable. The module gt_spector/game_world.py reads this.

# Component classification:
# - static: fixed UI, always at the same pixel. Direct click; no template
#   search. E.g. shelter (65,800), map_search (38,623).
# - dynamic: non-fixed, located via template search. E.g. avatar border
#   (picture inside changes, border is invariant).
# - drifts: world-scoped, may move with the camera but tracked for reference.
#
# Avatar menu note (2026-08-02):
# Bottom tab bar: ranking_static, settings_static, likes_static, more_static.
# settings_static opens the settings menu where the account menu lives
# (needed for login / account switching).
# Stamina:
# - stamina_value: the stamina count shown ON TOP of the green stamina bar.
#   Background is the bar (green) or black depending on bar fill. The value
#   is important for future bot decisions (e.g. when to refill).
# - stamina_add: button that opens the stamina dialog where consumables can
#   be exchanged for stamina.
#
# Navigation rule (2026-08-02):
# ESC always takes you back one menu level. This is a reliable universal
# "back" action for any screen that has a visible close/back button too.
#
# Settings menu note (2026-08-02):
# The settings menu content is SCROLLABLE vertically - do NOT assume the menu
# icons are at fixed positions; locate them via templates each time.
# - system_settings_static: opens system settings (graphics quality, frame
#   rate, screen resolution, sound). Use to set graphics/frame-rate low and
#   disable sound on bots.
# - account_static: opens the account menu where accounts can be linked,
#   unlinked, and switched. This is the path for changing a bot's account.
#
# Template scoring note (2026-08-02):
# The shelter view and world map can have slightly different backgrounds. The
# same template (e.g. avatar border) scores ~1.0 on one view and ~0.98 on the
# other. This is expected - normalized correlation is robust but not free of
# background influence. Default score_threshold (0.75) leaves a safe margin.
#
# Mission menu note (2026-08-02):
# - mission_menu_static: the invariant part of the mission button, used to
#   identify the mission menu reliably.
# - mission_menu_count: the completed-mission count badge (red background).
#   Not needed yet, but in the future it can be read to auto-collect rewards
#   for completed missions.
#
# Chat note (2026-08-02):
# - chat_static: the invariant part of the chat button, used to identify it.
# - chat_unread: a red-background @ badge that appears when there are unread
#   messages. Not needed yet; in the future it can alert on unread chat.
#
# Alliance menu note (2026-08-02):
# - alliance_menu_static: the invariant part of the alliance button, used to
#   identify it.
# - alliance_menu_count: indicates rewards available inside the alliance menu.
#   Not needed yet; in the future it can be used to claim alliance rewards.
#
# VIP note (2026-08-02):
# - vip_reward: shows if a VIP reward is available. Shifts ~30px right when
#   the VIP level is >9.
#
# Messages note (2026-08-02):
# - messages_static: the invariant part of the messages button, used to
#   identify it.
# - messages_count: badge on the messages button. Not needed yet.
#
# Count badges (IMPORTANT, 2026-08-02):
# The *_count templates (mission_menu_count, chat_unread, alliance_menu_count,
# messages_count, bag_count, hero_count) will NEVER match exactly because the
# number inside the badge changes. Do not template-match the digit. The
# reliable signal is the RED BACKGROUND with a number - template the badge's
# red-background shape (which is constant) for presence detection, and use the
# VLM reader to read the digit when the value is needed.
#
# Count badge digit limit (IMPORTANT, 2026-08-02):
# When a count reaches 3 digits (>= 100), the badge shows "..." instead of
# the number. Treat "..." as a valid "present with a large count" signal.
#
# Map alliance help (2026-08-02):
# - map_alliance_help: an alliance help button on the world map. Can be
#   MISSING when no help is requested; if present, an alliance member has
#   requested help. Same mechanic as "help" inside the alliance menu (to be
#   mapped later). This is the button the Help bot targets.
# - The top-right notification row (alliance help, event icons) is
#   TRANSIENT and self-managing: icons appear/disappear with game events
#   (arms race alert, another member fulfilling the help request, etc.) and
#   shift the row's layout. Always locate these via template search and
#   treat a missing match as "no action needed" - never fixed-click them.
# - arms_race_static: an arms-race event notification icon that can appear
#   in the same row and push the alliance-help icon left. Transient.
#   Observed 2026-08-02: the help request icon disappeared because another
#   member already fulfilled the request.
#
# Bag / hero note (2026-08-02):
# - bag: identifies the bag/inventory button (its icon; no separate _static).
# - bag_count: red badge on the bag. Presence via red background.
# - hero_static: identifies the hero button (invariant).
# - hero_count: red badge on the hero button. Presence via red background.

version: 1

# Named clickable locations. Each: x, y, and the screens it appears on.
# Static UI chrome is reliable. "drifts" marks world-scoped anchors that may
# move with the camera but are tracked for reference.
locations:
  exit_cancel:       {x: 359, y: 654, screens: [exit_dialog]}
  exit_ok:           {x: 801, y: 648, screens: [exit_dialog]}
  login_failed_ok:   {x: 499, y: 647, screens: [login_failed_dialog]}
  login_failed_device_login: {x: 420, y: 767, screens: [login_failed_dialog]}
  login_failed_more: {x: 558, y: 767, screens: [login_failed_dialog]}
  afk_ok:            {x: 741, y: 676, screens: [afk_popup]}
  glory_league_go:   {x: 575, y: 654, screens: [glory_league_event]}
  avatar:            {x: 49,  y: 39,  screens: [world_map, world_map_regional, shelter_view]}
  shelter:           {x: 65,  y: 800, screens: [world_map, world_map_regional], static: true}
  region_static:     {x: 59,  y: 792, screens: [shelter_view]}
  back_static:       {x: 44,  y: 38,  screens: [avatar_menu]}
  commander_static:  {x: 141, y: 40,  screens: [avatar_menu]}
  ranking_static:    {x: 61,  y: 786, screens: [avatar_menu]}
  settings_static:   {x: 159, y: 789, screens: [avatar_menu]}
  settings_title_static: {x: 571, y: 143, screens: [settings]}
  likes_static:      {x: 261, y: 790, screens: [avatar_menu]}
  more_static:       {x: 361, y: 789, screens: [avatar_menu]}
  stamina_value:     {x: 992, y: 275, screens: [avatar_menu]}
  stamina_add:       {x: 1119, y: 275, screens: [avatar_menu]}
  settings_account:  {x: 218, y: 510, screens: [settings]}
  change_account:    {x: 512, y: 765, screens: [account]}
  account_title:     {x: 442, y: 167, screens: [account]}
  system_settings_static: {x: 466, y: 248, screens: [settings]}
  account_static:    {x: 260, y: 417, screens: [settings]}
  map_search:        {x: 38,  y: 623, screens: [world_map, world_map_regional], static: true}
  chat:              {x: 139, y: 810, screens: [world_map, world_map_regional]}
  vip_menu:          {x: 113, y: 56,  screens: [world_map, world_map_regional]}
  region_overview:   {x: 1120, y: 800, screens: [world_map, world_map_regional]}
  messages:          {x: 1113, y: 751, screens: [world_map, world_map_regional]}
  region_search:     {x: 439, y: 15,  screens: [world_map, world_map_regional]}
  alliance_flags:    {x: 485, y: 21,  screens: [world_map, world_map_regional]}
  mission_menu:      {x: 34,  y: 698, screens: [world_map]}
  radar_station:     {x: 103, y: 616, screens: [world_map], drifts: true}
  alliance_menu:     {x: 951, y: 800, screens: [world_map], drifts: true}
  hero_menu:         {x: 1046, y: 802, screens: [world_map], drifts: true}
  bag:               {x: 875, y: 796, screens: [world_map], drifts: true}
  campaign_menu:     {x: 800, y: 800, screens: [world_map], drifts: true}

# World zones on the regional map: zone_1 outer, zone_2 middle, zone_3 center.
zones:
  zone_1: {name: "outer ring", note: "outside edge of the region"}
  zone_2: {name: "mid ring",   note: "between zone 1 and zone 3"}
  zone_3: {name: "center",     note: "center part of the region"}

# Map zoom levels. The discriminator between them is the minimap presence in
# the top-right corner (regional zoom shows it; world map does not).
map_levels:
  world_map:
    description: zoomed in, no minimap, actors/vehicles/zombies visible
    fingerprint:
      # No minimap in top-right: a UI-free probe region should be map/ground.
      - [1010, 45, 60, 200, 70, 210, 60, 200]
  world_map_regional:
    description: regional zoom, semi-transparent minimap top-right, no actors
    fingerprint:
      # Minimap present: probe region is a distinct minimap surface.
      - [1010, 45, 140, 255, 140, 255, 140, 255]

# Screens with stable anchor fingerprints (captured live, refined over time).
screens:
  shelter_view:
    description: shelter/base view. Identified by avatar border + region_static icon.
    templates: [avatar, region_static]
  avatar_menu:
    description: avatar / commander info menu. Identified by back + commander_static.
    templates: [back_static, commander_static]
  settings:
    description: settings menu. Account option at 218,510 (login/account switching).
    templates: [settings_title_static]
  account:
    description: account management menu. CHANGE ACCOUNT button at 512,765.
    templates: []
  system_settings:
    description: system settings - graphics quality, frame rate, resolution, sound.
    templates: []
  exit_dialog:
    description: '"Exit game?" confirmation with CANCEL / OK'
    fingerprint: []
  glory_league_event:
    description: 'Pompeii Glory League event splash with GO button'
    fingerprint:
      - [575, 654, 60, 200, 90, 200, 30, 120]  # GO button (saturated)
      - [517, 100, 30, 200, 40, 200, 40, 200]  # event panel area
  afk_popup:
    description: '"Auto collect AFK resources" popup with single orange OK button'
    fingerprint:
      - [741, 676, 190, 255, 130, 200, 30, 110]  # orange OK button
      - [550, 820, 0, 60, 0, 60, 0, 60]  # dim panel bottom
  login_failed_dialog:
    description: '"Login failed: session expired!" modal with OK / Device Log In / More'
    fingerprint:
      - [517, 671, 220, 255, 220, 255, 220, 255]  # bright title text
      - [550, 820, 0, 60, 0, 60, 0, 60]  # dim dialog panel bottom
  world_map:
    description: world map, zoomed in (no minimap)
    templates: [avatar]
  world_map_regional:
    description: regional map, minimap top-right
    fingerprint:
      - [15, 9, 110, 180, 90, 160, 60, 130]   # avatar border top-left corner (static)
      - [1010, 45, 140, 255, 140, 255, 140, 255]  # minimap present

# Navigation: reachable screens from each screen + recommended action.
navigation:
  settings:
    avatar_menu:        {action: locate, name: exit_static}
    account:            {action: locate, name: account_static}
    system_settings:    {action: locate, name: system_settings_static}
  account:
    settings:           {action: locate, name: exit_static}
  avatar_menu:
    world_map:          {action: locate, name: back_static}
    settings:           {action: locate, name: settings_static}
  shelter_view:
    world_map:          {action: locate, name: region_static}
  exit_dialog:
    shelter:            {action: click, location: exit_cancel}
    world_map:          {action: click, location: exit_cancel}
  afk_popup:
    world_map:          {action: click, location: afk_ok}
  login_failed_dialog:
    world_map:          {action: click, location: login_failed_ok}
  world_map:
    avatar_menu:        {action: locate, name: avatar}
    world_map_regional: {action: zoom_out}
    shelter:            {action: click, location: shelter}
    chat:               {action: click, location: chat}
    hero_menu:          {action: locate, name: hero_static}
    bag:                {action: locate, name: bag}
    alliance_menu:      {action: locate, name: alliance_menu_static}
    campaign_menu:      {action: locate, name: campaign_menu}
    radar_station:      {action: locate, name: radar_station}
  world_map_regional:
    world_map:          {action: zoom_in}
    shelter:            {action: click, location: shelter}
    chat:               {action: click, location: chat}
    vip_menu:           {action: click, location: vip_menu}
    region_overview:    {action: click, location: region_overview}
    messages:           {action: click, location: messages}
